# Alternative to docker-compose.yml, for Linux hosts needing multicast discovery.
services:
  adaptive-frame-matte:
    build: .
    image: adaptive-frame-matte:local
    network_mode: host
    volumes:
      - ${FRAME_DATA_PATH:-./data}:/data
    environment:
      FRAME_DATA_DIR: /data
      FRAME_MOCK_TV: ${FRAME_MOCK_TV:-false}
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
