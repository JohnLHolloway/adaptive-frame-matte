[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-frame-matte"
version = "0.2.1"
description = "Local, explainable adaptive mattes for Samsung Frame TVs"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.22,<1", "pillow>=12,<13", "numpy>=2,<3",
  "scikit-image>=0.25,<1", "opencv-python-headless>=4.11,<6", "astral>=3.2,<4",
  "tzdata>=2025.1", "httpx>=0.28,<1",
  "samsungtvws @ git+https://github.com/NickWaterton/samsung-tv-ws-api.git@fe95ef1d784cd32f49bf9a07ec479576574eea07",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
markers = ["live: opt-in physical television tests; excluded from CI"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
